<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gabby Football Quiz 🏈</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <!-- Logged-in header -->
  <header id="topbar" class="topbar hidden">
    <span id="welcome" class="welcome"></span>
    <nav class="nav">
      <a id="nav-admin" class="nav-link admin-only hidden" href="#">Question Editor</a>
      <button id="btn-back" class="btn btn-outline hidden">Home</button>
      <button id="btn-logout" class="btn btn-outline">Log Out</button>
    </nav>
  </header>

  <main class="container">
    <h1 class="title">Gabby Football Quiz</h1>
    <p class="tagline">Log in to play 🏈</p>

    <!-- Login form -->
    <section id="login-card" class="card">
      <h2 class="card-title">Log In</h2>
      <form id="login-form" class="form">
        <label class="label">Username
          <input id="login-username" class="input" type="text" autocomplete="username" required />
        </label>
        <label class="label">Password
          <input id="login-password" class="input" type="password" autocomplete="current-password" required />
        </label>
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>
      <p class="switch">New here? <a href="#" id="show-register">Create an account</a></p>
    </section>

    <!-- Register form -->
    <section id="register-card" class="card hidden">
      <h2 class="card-title">Create Account</h2>
      <form id="register-form" class="form">
        <label class="label">Username
          <input id="reg-username" class="input" type="text" autocomplete="username" minlength="3" required />
        </label>
        <label class="label">Email
          <input id="reg-email" class="input" type="email" autocomplete="email" required />
        </label>
        <label class="label">Password (8+ characters)
          <input id="reg-password" class="input" type="password" autocomplete="new-password" minlength="8" required />
        </label>
        <button type="submit" class="btn btn-primary">Sign Up</button>
      </form>
      <p class="switch">Already have an account? <a href="#" id="show-login">Log in</a></p>
    </section>

    <!-- Home view: role badge + quiz picker -->
    <section id="home-card" class="card hidden">
      <h2 class="card-title" id="hello"></h2>
      <p id="role-badge" class="role-badge"></p>
      <p class="section-label">Pick a quiz:</p>
      <div id="quiz-list" class="quiz-list"></div>
      <p id="admin-note" class="admin-note admin-only hidden" style="text-align:center">
        🛠️ Admin powers active — the Question Editor arrives in Phase 5.
      </p>
    </section>

    <!-- Quiz view -->
    <section id="quiz-card" class="card quiz-card hidden">
      <div class="quiz-top">
        <span id="q-quiz-title" class="q-quiz-title"></span>
        <span id="timer" class="timer">5:00</span>
      </div>
      <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
      <p id="q-count" class="q-count"></p>
      <h2 id="question" class="question"></h2>
      <div id="options" class="options"></div>
      <p id="feedback" class="feedback"></p>
      <p id="explanation" class="explanation"></p>
      <div class="quiz-controls">
        <button id="btn-prev" class="btn btn-outline">Previous</button>
        <button id="btn-next" class="btn btn-primary" disabled>Next</button>
      </div>
    </section>

    <!-- Results view -->
    <section id="results-card" class="card hidden">
      <h2 class="card-title">Your Results 💯</h2>
      <p id="final-score" class="final-score"></p>
      <p id="result-msg" class="result-msg"></p>
      <button id="btn-retry" class="btn btn-primary">Retry Quiz</button>
      <button id="btn-home-results" class="btn btn-outline">Back to Quizzes</button>
    </section>

    <p id="msg" class="msg" role="alert"></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
